<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FlapEmu</title>
    <!-- Prevent caching for kiosk mode -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Error Overlay -->
    <div class="system-status" id="system-status"></div>

    <div class="main-container">
        <!-- Product shell chrome (consumer-owned) -->
        <div class="top-bar" style="display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:20px; height:70px;">
            <div style="width:50px; height:50px; flex-shrink:0;">
                <img src="timetable/logo.svg" alt="Logo" style="width:100%; height:100%; object-fit:contain;">
            </div>
            <div style="text-align:center;">
                <div style="font-size:28px; font-weight:900; color:#fff; line-height:1.1;">FlapEmu</div>
                <div style="font-size:14px; font-weight:600; color:rgba(255,255,255,0.6);">Demo Board</div>
            </div>
        </div>

        <div class="schedule-board" id="board"></div>
        <div class="board-footer">

            <div class="copyright">
                Powered by <a href="https://github.com/tyoubin/flapemu" target="_blank">FlapEmu</a>
            </div>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
