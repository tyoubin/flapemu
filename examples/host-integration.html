<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlapEmu Host Integration</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body { margin: 0; padding: 24px; }
        .host-header { color: #fff; margin: 0 auto 20px; max-width: 1100px; }
        .host-status { color: #f5f5f5; min-height: 1.5em; margin: 0 auto 12px; max-width: 1100px; }
    </style>
</head>
<body>
    <header class="host-header">
        <h1>Host-owned timetable</h1>
        <p>This page owns its markup, data loading, and board lifecycle.</p>
        <div style="margin-top: 12px; display: flex; gap: 8px;">
            <button id="btn-refresh" style="padding: 6px 12px; cursor: pointer;">Refresh Board</button>
            <button id="btn-destroy" style="padding: 6px 12px; cursor: pointer;">Destroy Board</button>
            <button id="btn-mount" style="padding: 6px 12px; cursor: pointer;">Remount Board</button>
        </div>
    </header>
    <div class="host-status" id="status" role="status"></div>
    <main class="schedule-board" id="board" aria-label="Train timetable"></main>

    <script type="module">
        import { mountBoard, normalizeBoardConfig } from '../js/index.js';

        const board = document.querySelector('#board');
        const status = document.querySelector('#status');
        let instance = null;
        let cachedConfig = null;

        async function loadBoard() {
            try {
                const response = await fetch('../timetable/demo.json', { cache: 'no-store' });
                if (!response.ok) throw new Error(`Unable to load timetable (${response.status})`);

                cachedConfig = normalizeBoardConfig(await response.json());
                instance = mountBoard(board, cachedConfig);
                status.textContent = '';
            } catch (error) {
                status.textContent = error.message;
                board.classList.add('board-error');
            }
        }

        document.querySelector('#btn-refresh').addEventListener('click', () => {
            if (instance && cachedConfig) {
                instance.updateBoard(cachedConfig.presets, cachedConfig.rows);
                status.textContent = 'Board refreshed via updateBoard()';
            }
        });

        document.querySelector('#btn-destroy').addEventListener('click', () => {
            if (instance) {
                instance.destroyBoard();
                instance = null;
                status.textContent = 'Board destroyed via destroyBoard()';
            }
        });

        document.querySelector('#btn-mount').addEventListener('click', () => {
            if (!instance && cachedConfig) {
                instance = mountBoard(board, cachedConfig);
                status.textContent = 'Board remounted via mountBoard()';
            }
        });

        loadBoard();
    </script>
</body>
</html>
